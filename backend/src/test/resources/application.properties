# Test configuration. Two things matter here, and both are about NOT touching the
# machine this runs on:
#
#  1. An in-memory database. The real datasource points at ~/.axvon/data/axvondb, and a
#     test suite that wipes tables (BackupRestoreTest does exactly that) must never be
#     pointed at somebody's live HR data.
#  2. A fixed JWT secret. JwtUtil otherwise generates one and writes it to
#     ~/.axvon/jwt.key, which would sign every real user out every time the tests run.
spring.datasource.url=jdbc:h2:mem:axvontest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

axvon.jwt.secret=axvon-test-only-signing-key-not-used-in-production-0123456789
axvon.jwt.expiration=86400000

logging.level.root=WARN
logging.level.com.axvon=WARN
# The app logs to ~/.axvon/logs in production; tests write to the console only.
logging.file.name=

# ── HR Assistant ────────────────────────────────────────────────────────────────
# A fixed, invalid key. This file shadows the main application.properties on the test
# classpath, so the ANTHROPIC_API_KEY of whoever runs the suite is never picked up —
# the tests must not spend money, must not depend on a network, and must behave the same
# on a machine that has a key and one that does not. The assistant's own tests mock the
# ChatModel bean, so nothing here ever reaches api.anthropic.com.
# The suite runs against the Anthropic code path with a mocked ChatModel, so it never
# depends on a locally-installed Ollama. The provider-selection logic itself is covered
# by unit assertions in AiAssistantTest rather than by booting a second context.
spring.ai.model.chat=anthropic
spring.ai.anthropic.api-key=test-key-never-sent-anywhere
spring.ai.anthropic.chat.options.model=claude-opus-5
spring.ai.retry.max-attempts=1

# The policy index must NOT land in ~/.axvon/ai: that sits beside somebody's live HR
# database, and a test that ingests a sample PDF would replace the company's real policy
# documents. Same reasoning as the in-memory datasource above.
axvon.ai.index-dir=${java.io.tmpdir}/axvon-ai-test
