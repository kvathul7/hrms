spring.application.name=axvon-hrms
server.port=17823
server.servlet.context-path=/api

# H2 Embedded Database — saves permanently to user's PC, no install needed
# H2 2.x rejects AUTO_SERVER=TRUE combined with DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:h2:file:${user.home}/.axvon/data/axvondb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=axvon
spring.datasource.password=axvon2025
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
# Deliberately EMPTY. A literal here would ship the same signing key inside every
# installation, letting anyone with a copy forge a session for any known account.
# JwtUtil generates a per-installation key in ~/.axvon/jwt.key on first start.
# Set AXVON_JWT_SECRET (32+ chars) to override, e.g. to share one key across machines.
axvon.jwt.secret=
axvon.jwt.expiration=86400000

# CORS — allows Electron and browser
axvon.cors.allowed-origins=http://localhost:17824,app://.

# Uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.com.axvon=INFO
logging.level.org.springframework.security=WARN
logging.file.name=${user.home}/.axvon/logs/axvon.log

# ── AXVON HR Assistant (Spring AI) ──────────────────────────────────────────────
# Which model answers. Both providers are on the classpath; this picks one.
#   ollama    - runs locally on the operator's machine. No key, no account, no network.
#               Needs Ollama installed (ollama.com) and a tool-capable model pulled.
#   anthropic - hosted, needs ANTHROPIC_API_KEY, better at refusing to invent a policy.
# Default is ollama so a fresh install can work without anybody signing up for anything.
spring.ai.model.chat=ollama

# The model MUST support tool calling, or the leave-balance and apply-leave tools are
# simply never invoked and the assistant answers from nothing. qwen2.5 is a small model
# with solid tool support; llama3.1 is a reasonable alternative. A chat-only model will
# appear to work and then quietly make numbers up, which is the worst failure available.
spring.ai.ollama.base-url=${AXVON_OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${AXVON_OLLAMA_MODEL:qwen2.5:7b}
# Never pull at startup. A model is several GB, and Electron abandons the backend after
# 60 seconds (main.js) — an auto-pull would stop the desktop app launching at all, the
# same way the eager embedding model did. The operator pulls it once, by hand.
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.init.chat.include=false
spring.ai.ollama.init.embedding.include=false

# Used only when spring.ai.model.chat=anthropic. The key is read from the environment and
# deliberately NOT stored here: application.properties ships inside the jar, inside the
# installer. The fallback is a placeholder rather than an empty string because Spring AI
# builds its AnthropicApi bean during startup, and an unusable value there would take the
# whole backend down — including the 12 modules that have nothing to do with the
# assistant. Nothing contacts Anthropic at startup, so the placeholder is inert;
# HrAssistantService recognises it and declines at request time with a readable message.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-configured}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
spring.ai.anthropic.chat.options.max-tokens=2048

# Chat replies are short, so the assistant is not worth retrying for a long time while
# somebody watches a spinner.
spring.ai.retry.max-attempts=2

# Policy search embeds text with a local ONNX model (all-MiniLM-L6-v2, bundled in the
# jar — no key, no network). The autoconfigured bean is EAGER, and loading the model plus
# unpacking its native libraries takes ~45s, which pushed startup to 62.5s against
# Electron's 60s launch timeout in main.js: the desktop app stopped launching at all.
# So the autoconfiguration is off and PolicyStoreConfig defines the same model @Lazy,
# moving that cost to the first policy question. Do NOT set this back to `transformers`.
spring.ai.model.embedding=none
